name: Keirin Data Scraper

on:
  schedule:
    # 毎日 朝6時と夕方18時 (日本時間) に自動実行する設定
    - cron: '0 21,9 * * *'
  workflow_dispatch: # GitHubの画面から手動で実行できるボタンを表示

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: チェックアウト
      uses: actions/checkout@v3

    - name: Node.jsのセットアップ
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: ライブラリのインストール
      run: npm install

    - name: Playwright（ブラウザ環境）のインストール
      run: npx playwright install --with-deps chromium

    - name: スクレイピングの実行
      run: node scraper.js

    - name: 取得したデータをコミット＆プッシュ（保存）
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add player_data.js
        git commit -m "データ自動更新" || exit 0
        git push
